<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowNetClient v1.5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .launcher-container {
            text-align: center;
            z-index: 10;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 200, 0.5);
        }

        h1 {
            color: #00ffc8;
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(0, 255, 200, 0.3);
            font-weight: 700;
        }

        .version {
            color: #888;
            font-size: 1.2rem;
            margin-bottom: 40px;
            font-style: italic;
        }

        .launch-button {
            background: linear-gradient(135deg, #00ffc8 0%, #00d9a3 100%);
            color: #000;
            border: none;
            padding: 18px 50px;
            font-size: 1.3rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .launch-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(0, 255, 200, 0.6);
        }

        .launch-button:active {
            transform: scale(0.98);
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(0, 255, 200, 0.1);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="launcher-container">
        <div class="logo">◆</div>
        <h1>ShadowNetClient</h1>
        <div class="version">v1.5</div>
        <button class="launch-button" onclick="launchClient()">Launch</button>
    </div>

    <script>
        function launchClient() {
            window.location.href = 'ShadowNetClient_1.12.2_WASM.html';
        }

        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 100 + 20;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 5 + 8) + 's';
                particle.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(particle);
            }
        }

        createParticles();
    </script>
</body>
</html>
